name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
    - master

jobs:
  build:
    strategy:
      matrix:
        os:
        - name: ubuntu-latest
          compiler: c++
          sanitize: -g3 -fsanitize=address,undefined
        - name: macos-latest
          compiler: c++
          sanitize: -g3 -fsanitize=address,undefined
        - name: windows-latest
          compiler: clang++
          define: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
        build:
        - jsontestsuite_test
        - json_test
        - example

    runs-on: ${{ matrix.os.name }}
    steps:
    - uses: actions/checkout@v4
    - name: build
      shell: bash
      run: ${{ matrix.os.compiler }} -o ${{ matrix.build }} ${{ matrix.build }}.cpp -std=c++20 -Wall -Wextra -Wpedantic ${{ matrix.os.sanitize }} ${{ matrix.os.define }}
    - name: run
      shell: bash
      run: ./${{ matrix.build }}
